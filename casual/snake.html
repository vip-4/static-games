<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake - Casual Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: Arial, sans-serif; color: #fff; }
h1 { color: #00b894; margin-bottom: 10px; }
canvas { border: 2px solid #00b894; background: #16213e; }
#score { margin: 10px; font-size: 20px; }
button { margin: 10px; padding: 8px 16px; background: #00b894; color: #16213e; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>
<h1>Snake</h1>
<div id="score">Score: 0</div>
<canvas id="game" width="400" height="400"></canvas>
<div><button id="restart">Restart</button></div>

<script>
// Snake Game - Classic arcade snake
// Technical: Canvas rendering, grid-based movement, array-based body tracking, food generation
// Difficulty: Easy - simple mechanics but requires reflexes

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const gridSize = 20;
const tileCount = canvas.width / gridSize;
let snake = [{x: 10, y: 10}];
let direction = {x: 1, y: 0};
let food = {x: 15, y: 15};
let score = 0;
let gameover = false;
let speed = 100;
let lastMove = 0;

function draw() {
  // Background
  ctx.fillStyle = '#16213e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Grid lines
  ctx.strokeStyle = '#1a1a2e';
  for (let i = 0; i < tileCount; i++) {
    ctx.beginPath(); ctx.moveTo(i*gridSize, 0); ctx.lineTo(i*gridSize, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i*gridSize); ctx.lineTo(canvas.width, i*gridSize); ctx.stroke();
  }
  
  // Food
  ctx.fillStyle = '#e94560';
  ctx.fillRect(food.x*gridSize, food.y*gridSize, gridSize, gridSize);
  
  // Snake
  snake.forEach((seg, i) => {
    ctx.fillStyle = i === 0 ? '#00b894' : '#00cec9';
    ctx.fillRect(seg.x*gridSize, seg.y*gridSize, gridSize-2, gridSize-2);
  });
}

function update() {
  // Move snake
  const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};
  snake.unshift(head);
  
  // Eat food
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = 'Score: ' + score;
    speed = Math.max(50, speed - 2);
    placeFood();
  } else {
    snake.pop();
  }
  
  // Wall collision
  if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
    endGame();
    return;
  }
  
  // Self collision
  for (let i = 1; i < snake.length; i++) {
    if (head.x === snake[i].x && head.y === snake[i].y) {
      endGame();
      return;
    }
  }
}

function placeFood() {
  food.x = Math.floor(Math.random() * tileCount);
  food.y = Math.floor(Math.random() * tileCount);
  // Make sure food doesn't appear on snake
  while (snake.some(s => s.x === food.x && s.y === food.y)) {
    food.x = Math.floor(Math.random() * tileCount);
    food.y = Math.floor(Math.random() * tileCount);
  }
}

function endGame() {
  gameover = true;
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#fff';
  ctx.font = '30px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
  ctx.font = '20px Arial';
  ctx.fillText('Score: ' + score, canvas.width/2, canvas.height/2+40);
}

function gameLoop(timestamp) {
  if (gameover) return;
  if (timestamp - lastMove > speed) {
    update();
    lastMove = timestamp;
  }
  draw();
  requestAnimationFrame(gameLoop);
}

document.addEventListener('keydown', e => {
  switch(e.key) {
    case 'ArrowUp': case 'w': case 'W':
      if (direction.y === 0) direction = {x:0, y:-1};
      break;
    case 'ArrowDown': case 's': case 'S':
      if (direction.y === 0) direction = {x:0, y:1};
      break;
    case 'ArrowLeft': case 'a': case 'A':
      if (direction.x === 0) direction = {x:-1, y:0};
      break;
    case 'ArrowRight': case 'd': case 'D':
      if (direction.x === 0) direction = {x:1, y:0};
      break;
  }
});

document.getElementById('restart').onclick = () => {
  snake = [{x:10, y:10}];
  direction = {x:1, y:0};
  score = 0;
  gameover = false;
  speed = 100;
  scoreEl.textContent = 'Score: 0';
  placeFood();
  gameLoop(0);
};

// Mobile controls
let touchStartX = 0, touchStartY = 0;
canvas.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive: true});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0 && direction.x === 0) direction = {x:1, y:0};
    else if (dx < 0 && direction.x === 0) direction = {x:-1, y:0};
  } else {
    if (dy > 0 && direction.y === 0) direction = {x:0, y:1};
    else if (dy < 0 && direction.y === 0) direction = {x:0, y:-1};
  }
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive: false});

gameLoop(0);
</script>
</body>
</html>
