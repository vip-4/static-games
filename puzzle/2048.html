<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 - Puzzle Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Arial', sans-serif; background: #faf8ef; display: flex; flex-direction: column; align-items: center; padding: 20px; }
h1 { color: #7c6f5d; margin-bottom: 10px; }
#grid { display: grid; grid-template-columns: repeat(4, 100px); grid-template-rows: repeat(4, 100px); gap: 10px; margin: 20px 0; }
.cell { width: 100px; height: 100px; background: #bbada0; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; color: #7c6f5d; }
.score-container { display: flex; gap: 20px; margin-bottom: 10px; }
.score-box { background: #bbada0; padding: 10px 20px; border-radius: 5px; color: #fff; }
.score-label { font-size: 12px; text-transform: uppercase; }
.score-value { font-size: 24px; font-weight: bold; }
button { padding: 10px 20px; font-size: 16px; background: #8f7a66; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
button:hover { background: #7c6f5d; }
.message { margin-top: 10px; font-size: 18px; min-height: 30px; }
</style>
</head>
<body>
<h1>2048</h1>
<div class="score-container">
  <div class="score-box"><div class="score-label">Score</div><div class="score-value" id="score">0</div></div>
  <div class="score-box"><div class="score-label">Best</div><div class="score-value" id="best">0</div></div>
</div>
<div id="grid"></div>
<div>
  <button id="newGame">New Game</button>
</div>
<div class="message" id="message"></div>

<script>
// 2048 Game - Pure HTML/CSS/JS, no dependencies
// Technical: Grid-based puzzle, keyboard swipe handling, tile merging algorithm
// Difficulty: Easy to learn, hard to master. Uses localStorage for high scores.

const grid = document.getElementById('grid');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const messageEl = document.getElementById('message');
let board = [];
let score = 0;
let best = parseInt(localStorage.getItem('2048best')) || 0;
bestEl.textContent = best;

function initBoard() {
  board = Array(16).fill(0);
  addTile();
  addTile();
  render();
  score = 0;
  updateScore();
  messageEl.textContent = '';
}

function addTile() {
  const empty = board.map((v, i) => v === 0 ? i : null).filter(v => v !== null);
  if (empty.length === 0) return;
  const pos = empty[Math.floor(Math.random() * empty.length)];
  board[pos] = Math.random() < 0.9 ? 2 : 4;
}

function render() {
  grid.innerHTML = '';
  board.forEach(val => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.textContent = val || '';
    if (val) {
      cell.style.background = getTileColor(val);
      cell.style.color = val <= 4 ? '#7c6f5d' : '#f9f6f2';
    }
    grid.appendChild(cell);
  });
}

function getTileColor(val) {
  const colors = { 2:'#eee4da',4:'#ede0c8',8:'#f2b179',9:'#edc22e',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e' };
  return colors[val] || '#3c3a32';
}

function updateScore() {
  scoreEl.textContent = score;
  if (score > best) {
    best = score;
    bestEl.textContent = best;
    localStorage.setItem('2048best', best);
  }
}

function move(dir) {
  let moved = false;
  const oldBoard = [...board];

  if (dir === 'left' || dir === 'right') {
    for (let r = 0; r < 4; r++) {
      let row = board.slice(r*4, r*4+4);
      if (dir === 'right') row.reverse();
      row = merge(row);
      if (dir === 'right') row.reverse();
      for (let c = 0; c < 4; c++) board[r*4+c] = row[c];
    }
  } else {
    for (let c = 0; c < 4; c++) {
      let col = [board[c], board[c+4], board[c+8], board[c+12]];
      if (dir === 'down') col.reverse();
      col = merge(col);
      if (dir === 'down') col.reverse();
      for (let r = 0; r < 4; r++) board[r*4+c] = col[r];
    }
  }

  moved = JSON.stringify(board) !== JSON.stringify(oldBoard);
  if (moved) {
    addTile();
    render();
    updateScore();
    if (isGameOver()) messageEl.textContent = 'Game Over!';
  }
}

function merge(row) {
  row = row.filter(v => v !== 0);
  for (let i = 0; i < row.length-1; i++) {
    if (row[i] === row[i+1]) {
      row[i] *= 2;
      score += row[i];
      row.splice(i+1, 1);
    }
  }
  while (row.length < 4) row.push(0);
  return row;
}

function isGameOver() {
  if (board.some(v => v === 0)) return false;
  for (let i = 0; i < 16; i++) {
    const v = board[i];
    if (i % 4 !== 0 && board[i-1] === v) return false;
    if (i < 12 && board[i+4] === v) return false;
  }
  return true;
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') move('left');
  else if (e.key === 'ArrowRight') move('right');
  else if (e.key === 'ArrowUp') move('up');
  else if (e.key === 'ArrowDown') move('down');
});

document.getElementById('newGame').onclick = initBoard;
initBoard();
</script>
</body>
</html>
